; Vi håller allting i plaintext här, skriv bara ner globala variabler
; som användaren ska kunna ändra, så inget hårdkodat finns här.
; -Axel

[Camera]
    USE_WEBCAM = 0
    OUTPUT_DIR = ./output
    PREVIEW_WIDTH = 640
    PREVIEW_HEIGHT = 480

[Model]
    ROBOFLOW_API_KEY = xk2CCvJ7MTn30680S75V
    ROBOFLOW_PROJECT = wagolab
    ROBOFLOW_MODEL_VERSION = 3
    CONFIDENCE_THRESHOLD = 0.5

[Calibration]
    MARKER_SIZE_MM = 50.0
    ARUCO_DICT = DICT_5x5_50

[Pick]
    PICK_Z = 10.0
    SUCTION_DELAY = 0.5
    ; Offsetjusteringar (viktigt för Z-offset från kalibreringspinnar)
    X_OFFSET = 0.0
    Y_OFFSET = 0.0
    Z_OFFSET = 0.0

[Robot Connection]
    ROBOT_IP = 192.168.5.1
    ROBOT_PORT = 29999
    ROBOT_SPEED = 20
    USER_COORD_INDEX = 7
    TOOL_INDEX = 2

[Robot Position]
    VERIFY_Z = 5.0
    SAFE_Z = 100.0
    ; Hemposition
    HOME_X = 51.7394
    HOME_Y = 100.0
    HOME_Z = 308.6934
    HOME_RX = 179.6461
    HOME_RY = 3.9245
    HOME_RZ = 89.1636
    ; Avlämningsposition (Drop zone) Defaultvärde 200,-200,50
    DROP_X = 200.0
    DROP_Y = -200.0
    DROP_Z = 50.0

[Safety Limits]
    WORKSPACE_X_MIN = -300.0
    WORKSPACE_X_MAX = 300.0
    WORKSPACE_Y_MIN = -300.0
    WORKSPACE_Y_MAX = 300.0

[Debug Options]
    SIMULATE_ROBOT = 0
    TEST_IMAGE = ./captured_images/img_0038.png
    SAVE_DEBUG_IMAGES = 0