; Vi håller allting i plaintext här, skriv bara ner globala variabler
; som användaren ska kunna ändra, så inget hårdkodat finns här.
; -Axel

[Camera]
    USE_WEBCAM = 0
    OUTPUT_DIR = ./output
    PREVIEW_WIDTH = 640
    PREVIEW_HEIGHT = 480

[Model]
    ROBOFLOW_API_KEY = xk2CCvJ7MTn30680S75V
    ROBOFLOW_PROJECT = wagolab
    ROBOFLOW_MODEL_VERSION = 3
    CONFIDENCE_THRESHOLD = 0.2

[Calibration]
    MARKER_SIZE_MM = 50.0
    ARUCO_DICT = DICT_5X5_50
    C0_PX_X = 0.0
    C0_PX_Y = 0.0
    C1_PX_X = 0.0
    C1_PX_Y = 0.0

[Pick]
    PICK_Z = 8.0
    SUCTION_DELAY = 0.5
    ; Offsetjusteringar (viktigt för Z-offset från kalibreringspinnar)
    X_OFFSET = -110.0548
    Y_OFFSET = -260.0339
    Z_OFFSET = 94.6838
    ; Robot koordinater (offset) vid aruco C1
    X1_REF = -66.5001
    Y1_REF = -240.9323

[Robot Connection]
    ROBOT_IP = 192.168.5.1
    ROBOT_PORT = 29999
    ROBOT_SPEED = 20
    USER_COORD_INDEX = 0
    TOOL_INDEX = 0

[Robot Position]
    VERIFY_Z = 5.0
    SAFE_Z = 190.0
    ; Hemposition
    HOME_X = -50.0000
    HOME_Y = -250.0000
    HOME_Z = 400.0000
    HOME_RX = 180.0000
    HOME_RY = -0.0000
    HOME_RZ = 90.0000
    ; Avlämningsposition (Drop zone) Defaultvärde 200,-200,50
    DROP_X = 123
    DROP_Y = -350
    DROP_Z = 160.0

[Safety Limits]
    WORKSPACE_X_MIN = -300.0
    WORKSPACE_X_MAX = 300.0
    WORKSPACE_Y_MIN = -300.0
    WORKSPACE_Y_MAX = 300.0

[Debug Options]
    SIMULATE_ROBOT = 0
    TEST_IMAGE = ./captured_images/img_0038.png
    SAVE_DEBUG_IMAGES = 0
    